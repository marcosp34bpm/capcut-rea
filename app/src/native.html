<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CapCut native engine — REA bridge</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f14;
        --panel: #161a22;
        --panel-2: #1e232d;
        --line: #2a313d;
        --text: #e6e9ef;
        --muted: #8b95a7;
        --accent: #4d7cfe;
        --ok: #3ecf8e;
        --warn: #f0a13a;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 { font-size: 15px; margin: 0; }
      .badge {
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .badge.on { color: var(--ok); border-color: #24664f; }
      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 12px;
        padding: 12px;
        height: calc(100vh - 50px);
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      section > h2 {
        margin: 0;
        padding: 10px 12px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .body { overflow: auto; padding: 12px; flex: 1; min-height: 0; }
      button {
        background: var(--accent);
        border: 0;
        color: #fff;
        border-radius: 6px;
        padding: 7px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      button.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      pre {
        background: #0a0c10;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font-size: 11px;
        overflow: auto;
        max-height: 340px;
        margin: 0 0 10px;
      }
      .seg {
        background: #23304d;
        border: 1px solid #33507f;
        border-radius: 4px;
        padding: 5px 9px;
        margin: 3px 0;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #232935; }
      .row:last-child { border-bottom: 0; }
      .row span:first-child { color: var(--muted); }
      label { display: block; margin: 8px 0 3px; font-size: 12px; color: var(--muted); }
      input, select {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 5px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      .warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <header>
      <h1>CapCut native engine</h1>
      <span class="badge on" id="engine">videoeditor_addon.node</span>
      <span class="badge" id="session">sessão —</span>
      <span class="badge" id="rev">rev —</span>
    </header>
    <main>
      <section>
        <h2>Native draft</h2>
        <div class="body">
          <div class="toolbar">
            <button id="split" class="ghost">segment.split</button>
            <button id="speed" class="ghost">video.setSpeed 2.0</button>
            <button id="mute" class="ghost">track.mute</button>
            <button id="canundo" class="ghost">undoRedo.canUndo</button>
            <button id="undo" class="ghost">undoRedo.undo</button>
            <button id="addvideo" class="ghost">video.add</button>
            <button id="reload" class="ghost">reload state</button>
          </div>
          <div id="tracks"></div>
          <label for="track">Track</label>
          <select id="track"></select>
          <label for="segment">Segment</label>
          <select id="segment"></select>
          <label for="offset">splitpos / startTime (µs)</label>
          <input id="offset" type="number" value="1500000" />
          <label for="media">Mídia para adicionar (path nativo)</label>
          <input id="media" type="text" value="C:/Users/marco/Documents/capcut-rea/app/native/media/clip.mp4" />
          <label for="mediaduration">sourceDuration (µs)</label>
          <input id="mediaduration" type="number" value="3000000" />
        </div>
      </section>
      <section>
        <h2>Engine log</h2>
        <div class="body">
          <pre id="log">aguardando…</pre>
          <div id="facts"></div>
        </div>
      </section>
    </main>
    <script src="./native.js" type="module"></script>
  </body>
</html>
